<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiFi Scanner — Channel Spectrum</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #1a1a2e;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}
h1 {
    font-size: 1.4em;
    margin-bottom: 10px;
    color: #aaa;
}
#controls {
    margin-bottom: 15px;
    display: flex;
    gap: 10px;
    align-items: center;
}
#controls input {
    background: #2a2a4a;
    border: 1px solid #444;
    color: #eee;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 14px;
    width: 200px;
}
#controls button {
    background: #3a6;
    border: none;
    color: #fff;
    padding: 7px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
}
#controls button:hover { background: #4b7; }
#controls button:disabled { background: #555; cursor: wait; }
#status {
    font-size: 12px;
    color: #888;
    margin-left: 10px;
}
#chart-container {
    position: relative;
    width: 100%;
    max-width: 1100px;
}
canvas {
    width: 100%;
    height: auto;
    display: block;
}
#legend {
    position: absolute;
    top: 20px;
    right: -10px;
    background: rgba(20, 20, 40, 0.9);
    border: 1px solid #444;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
    max-height: 400px;
    overflow-y: auto;
}
.legend-item {
    display: flex;
    align-items: center;
    margin: 4px 0;
    gap: 6px;
    cursor: pointer;
}
.legend-item input[type="checkbox"] {
    accent-color: currentColor;
    cursor: pointer;
}
.legend-color {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
}
.legend-label {
    white-space: nowrap;
}
.legend-item.hidden .legend-label {
    text-decoration: line-through;
    opacity: 0.5;
}
#error {
    color: #f66;
    margin-top: 10px;
    font-size: 13px;
}
</style>
</head>
<body>

<h1>WiFi Channel Spectrum</h1>

<div id="controls">
    <input type="text" id="ip-input" placeholder="ESP32 IP:port (e.g. 192.168.1.115:8080)">
    <button id="fetch-btn" onclick="startFetching()">Connect</button>
    <span id="status"></span>
</div>

<div id="chart-container">
    <canvas id="chart" width="1100" height="550"></canvas>
    <div id="legend"></div>
</div>

<div id="error"></div>

<script>
const COLORS = [
    '#ff8c00', '#4cdf4c', '#6cb4ee', '#c77dff', '#00cccc',
    '#e8a838', '#ff6b6b', '#48d1cc', '#ff69b4', '#87ceeb',
    '#daa520', '#98fb98', '#dda0dd', '#f0e68c', '#cd853f'
];

// Channel center frequencies (MHz) for 2.4 GHz
const CHANNEL_FREQ = {
    1: 2412, 2: 2417, 3: 2422, 4: 2427, 5: 2432, 6: 2437,
    7: 2442, 8: 2447, 9: 2452, 10: 2457, 11: 2462, 12: 2467, 13: 2472
};

let fetchInterval = null;
let networks = [];
let hiddenSSIDs = new Set(); // SSIDs the user has unchecked

function startFetching() {
    const input = document.getElementById('ip-input');
    const addr = input.value.trim();
    if (!addr) { showError('Enter the ESP32 IP address'); return; }

    clearError();
    if (fetchInterval) clearInterval(fetchInterval);

    fetchData(addr);
    fetchInterval = setInterval(() => fetchData(addr), 5000);
    document.getElementById('fetch-btn').textContent = 'Refresh';
}

async function fetchData(addr) {
    const status = document.getElementById('status');
    status.textContent = 'fetching...';

    try {
        const url = `http://${addr}/`;
        const resp = await fetch(url);
        const data = await resp.json();
        networks = data.networks || [];
        status.textContent = `${networks.length} APs — ${new Date().toLocaleTimeString()}`;
        clearError();
        draw();
    } catch (e) {
        status.textContent = 'error';
        showError(`Fetch failed: ${e.message}. Ensure ESP32 is reachable and CORS is allowed.`);
    }
}

function showError(msg) { document.getElementById('error').textContent = msg; }
function clearError() { document.getElementById('error').textContent = ''; }

function draw() {
    const canvas = document.getElementById('chart');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // Chart margins
    const margin = { top: 30, right: 200, bottom: 50, left: 70 };
    const cw = W - margin.left - margin.right;
    const ch = H - margin.top - margin.bottom;

    // Axes ranges
    const chMin = 0.5, chMax = 13.5;  // channel range with padding
    const dbMin = -100, dbMax = -10;   // dBm range

    function xPos(channel) {
        return margin.left + ((channel - chMin) / (chMax - chMin)) * cw;
    }
    function yPos(dbm) {
        return margin.top + ((dbMax - dbm) / (dbMax - dbMin)) * ch;
    }

    // Clear
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);

    // Grid
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 0.5;

    // Horizontal grid lines (dBm)
    const dbSteps = [-10, -21, -32, -43, -55, -66, -77, -88, -100];
    ctx.font = '11px monospace';
    ctx.fillStyle = '#888';
    ctx.textAlign = 'right';
    for (const db of dbSteps) {
        const y = yPos(db);
        ctx.beginPath();
        ctx.moveTo(margin.left, y);
        ctx.lineTo(margin.left + cw, y);
        ctx.stroke();
        ctx.fillText(`${db} dBm`, margin.left - 8, y + 4);
    }

    // Vertical grid lines (channels)
    ctx.textAlign = 'center';
    for (let ch = 1; ch <= 13; ch++) {
        const x = xPos(ch);
        ctx.beginPath();
        ctx.moveTo(x, margin.top);
        ctx.lineTo(x, margin.top + ch);  // intentional short line
        ctx.moveTo(x, margin.top);
        ctx.lineTo(x, H - margin.bottom);
        ctx.stroke();
        ctx.fillText(ch.toString(), x, H - margin.bottom + 18);
    }

    // Axis labels
    ctx.fillStyle = '#aaa';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Channel', margin.left + cw / 2, H - 8);

    ctx.save();
    ctx.translate(15, margin.top + ch / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('Signal Strength (dBm)', 0, 0);
    ctx.restore();

    // Sort by RSSI ascending so strongest are drawn on top
    const sorted = [...networks].sort((a, b) => a.rssi - b.rssi);

    // Build legend with checkboxes
    const legendEl = document.getElementById('legend');
    legendEl.innerHTML = '';

    sorted.forEach((ap, idx) => {
        const color = COLORS[idx % COLORS.length];
        const visible = !hiddenSSIDs.has(ap.ssid);
        const item = document.createElement('div');
        item.className = 'legend-item' + (visible ? '' : ' hidden');
        item.innerHTML = `
            <input type="checkbox" ${visible ? 'checked' : ''}>
            <div class="legend-color" style="background:${color}"></div>
            <span class="legend-label">${escHtml(ap.ssid)} (ch ${ap.channel}, ${escHtml(ap.quality)})</span>
        `;
        const checkbox = item.querySelector('input');
        checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
                hiddenSSIDs.delete(ap.ssid);
            } else {
                hiddenSSIDs.add(ap.ssid);
            }
            draw();
        });
        legendEl.appendChild(item);
    });

    // Draw each visible AP as a gaussian bell curve
    sorted.forEach((ap, idx) => {
        if (hiddenSSIDs.has(ap.ssid)) return;

        const color = COLORS[idx % COLORS.length];
        const channel = ap.channel;
        const rssi = ap.rssi;

        // Gaussian bell curve: peak at (channel, rssi), width ~2 channels (20 MHz)
        const sigma = 1.8; // channel units — gives a nice 20MHz-ish spread
        const peakY = rssi;
        const baseY = dbMin; // curve goes down to noise floor

        ctx.beginPath();
        const steps = 200;
        const xStart = Math.max(chMin, channel - 4 * sigma);
        const xEnd = Math.min(chMax, channel + 4 * sigma);
        const dx = (xEnd - xStart) / steps;

        for (let i = 0; i <= steps; i++) {
            const chX = xStart + i * dx;
            const dist = chX - channel;
            const gaussian = Math.exp(-(dist * dist) / (2 * sigma * sigma));
            const dbm = baseY + (peakY - baseY) * gaussian;
            const px = xPos(chX);
            const py = yPos(dbm);
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }

        // Close path along bottom
        ctx.lineTo(xPos(xEnd), yPos(baseY));
        ctx.lineTo(xPos(xStart), yPos(baseY));
        ctx.closePath();

        // Fill with transparency
        ctx.fillStyle = hexToRgba(color, 0.3);
        ctx.fill();

        // Stroke outline
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
            const chX = xStart + i * dx;
            const dist = chX - channel;
            const gaussian = Math.exp(-(dist * dist) / (2 * sigma * sigma));
            const dbm = baseY + (peakY - baseY) * gaussian;
            const px = xPos(chX);
            const py = yPos(dbm);
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Draw SSID label above the peak
        ctx.fillStyle = color;
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        const labelY = yPos(rssi) - 8;
        ctx.fillText(ap.ssid, xPos(channel), labelY);
    });

    // Title bar
    ctx.fillStyle = '#ccc';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    const strongest = sorted.length > 0 ? sorted[sorted.length - 1] : null;
    if (strongest) {
        ctx.fillText(
            `Current channel: ${strongest.channel}, strongest: ${strongest.rssi} dBm`,
            margin.left + cw / 2, 18
        );
    }
}

function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
}

function escHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Allow Enter key in input
document.getElementById('ip-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') startFetching();
});
</script>

</body>
</html>
